<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YT Downloader</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e0e;
    --surface: #161616;
    --border: #2a2a2a;
    --accent: #d4f700;
    --accent-dim: #a8c200;
    --text: #e8e8e8;
    --muted: #666;
    --error: #ff4d4d;
    --radius: 4px;
    --transition-theme: background 0.2s, color 0.2s, border-color 0.2s;
  }

  :root.light {
    --bg: #f5f5f0;
    --surface: #ebebeb;
    --border: #d0d0d0;
    --accent: #5a7a00;
    --accent-dim: #3f5600;
    --text: #1a1a1a;
    --muted: #888;
    --error: #cc2200;
  }

  body { transition: var(--transition-theme); }
  input[type="text"], select { transition: var(--transition-theme); }

  /* Botão tema */
  .theme-btn {
    position: fixed;
    top: 1.25rem;
    right: 1.25rem;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0.4rem 0.75rem;
    border-radius: var(--radius);
    cursor: pointer;
    width: auto;
    transition: var(--transition-theme);
  }
  .theme-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--surface); }
  .theme-btn:active { transform: scale(0.98); }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .container {
    width: 100%;
    max-width: 640px;
  }

  header {
    margin-bottom: 3rem;
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(2.5rem, 6vw, 4rem);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.02em;
    color: var(--accent);
  }

  h1 span {
    color: var(--muted);
    font-weight: 700;
  }

  .subtitle {
    margin-top: 0.5rem;
    font-size: 0.75rem;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .field {
    margin-bottom: 1.25rem;
  }

  label {
    display: block;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.4rem;
  }

  input[type="text"], select {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.875rem;
    padding: 0.75rem 1rem;
    border-radius: var(--radius);
    outline: none;
    transition: border-color 0.15s;
    appearance: none;
  }

  input[type="text"]:focus, select:focus {
    border-color: var(--accent);
  }

  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }

  .toggle-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
  }

  .toggle-label {
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }

  /* Toggle switch */
  .toggle {
    position: relative;
    width: 36px;
    height: 20px;
    flex-shrink: 0;
  }

  .toggle input { display: none; }

  .toggle-track {
    position: absolute;
    inset: 0;
    background: var(--border);
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .toggle input:checked + .toggle-track { background: var(--accent); }

  .toggle-thumb {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 14px;
    height: 14px;
    background: #fff;
    border-radius: 50%;
    transition: transform 0.2s;
    pointer-events: none;
  }

  .toggle input:checked ~ .toggle-thumb { transform: translateX(16px); }

  button {
    width: 100%;
    background: var(--accent);
    color: #0e0e0e;
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 0.9rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    border: none;
    padding: 0.9rem 1rem;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }

  button:hover { background: var(--accent-dim); }
  button:active { transform: scale(0.99); }
  button:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }

  /* Progress */
  .progress-box {
    margin-top: 2rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem;
    display: none;
  }

  .progress-box.visible { display: block; }

  .progress-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 0.75rem;
  }

  .progress-status {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
  }

  .progress-percent {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 1.5rem;
    color: var(--accent);
  }

  .progress-bar-track {
    height: 3px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 0.75rem;
  }

  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
    width: 0%;
    transition: width 0.3s ease;
  }

  .progress-meta {
    display: flex;
    gap: 1.5rem;
    font-size: 0.7rem;
    color: var(--muted);
  }

  .progress-meta span b {
    color: var(--text);
    font-weight: 500;
  }

  .msg {
    margin-top: 1rem;
    font-size: 0.75rem;
    padding: 0.6rem 0.8rem;
    border-radius: var(--radius);
    display: none;
  }

  .msg.error { display: block; background: #1a0a0a; color: var(--error); border: 1px solid #3a1010; }
  .msg.success { display: block; background: #0d1a00; color: var(--accent); border: 1px solid #1e3a00; }
  :root.light .msg.error { background: #fff0ee; border-color: #f0b0a0; }
  :root.light .msg.success { background: #f0f8e0; border-color: #b0cc70; }

  /* Info box */
  .info-box {
    margin-bottom: 1.25rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.9rem 1rem;
    display: none;
    transition: var(--transition-theme);
  }
  .info-box.visible { display: block; }
  .info-box-thumb {
    width: 100%;
    aspect-ratio: 16/9;
    object-fit: cover;
    border-radius: var(--radius);
    margin-bottom: 0.75rem;
    display: none;
    background: var(--border);
  }
  .info-box-thumb.visible { display: block; }
  .info-box-embed {
    width: 100%;
    aspect-ratio: 16/9;
    border-radius: var(--radius);
    margin-bottom: 0.75rem;
    border: none;
    display: none;
    background: #000;
  }
  .info-box-embed.visible { display: block; }
  .info-box-title {
    font-size: 0.8rem;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 0.5rem;
  }
  .info-box-meta {
    display: flex;
    gap: 1.5rem;
    font-size: 0.7rem;
    color: var(--muted);
  }
  .info-box-meta span b { color: var(--accent); font-weight: 500; }
  .info-loading {
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.08em;
  }

  /* select arrow */
  .select-wrap { position: relative; }
  .select-wrap::after {
    content: '▾';
    position: absolute;
    right: 0.75rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
    font-size: 0.8rem;
  }

  /* Playlist UI */
  .playlist-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    background: rgba(212, 247, 0, 0.12);
    color: var(--accent);
    border: 1px solid var(--accent);
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    padding: 0.25rem 0.5rem;
    border-radius: var(--radius);
    margin-bottom: 0.6rem;
    text-transform: uppercase;
  }
  :root.light .playlist-badge {
    background: rgba(90, 122, 0, 0.12);
    color: var(--accent);
    border-color: var(--accent);
  }

  .playlist-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius);
    padding: 1rem;
    margin-bottom: 1.25rem;
    transition: var(--transition-theme);
  }
  .playlist-card-title {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 0.75rem;
  }

  .progress-current-item {
    font-size: 0.75rem;
    color: var(--text);
    margin-bottom: 0.6rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
</style>
</head>
<body>
<button class="theme-btn" id="theme-btn">☀ Claro</button>
<div class="container">
  <header>
    <h1>YT<span>/</span>DL</h1>
    <p class="subtitle">YouTube Downloader — local</p>
  </header>

  <div class="field">
    <label for="url">URL do vídeo ou playlist</label>
    <input type="text" id="url" placeholder="https://www.youtube.com/playlist?list=... ou /watch?v=..." />
  </div>

  <div class="info-box" id="info-box">
    <div class="playlist-badge" id="playlist-badge" style="display:none;">
      <span>📋</span> <span id="playlist-badge-text">Playlist Detectada</span>
    </div>
    <iframe class="info-box-embed" id="info-embed" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
    <img class="info-box-thumb" id="info-thumb" src="" alt="" />
    <div class="info-box-title" id="info-title"></div>
    <div class="info-box-meta">
      <span id="meta-size-wrapper">Tamanho: <b id="info-size">—</b></span>
      <span id="meta-duration-wrapper">Duração: <b id="info-duration">—</b></span>
      <span id="meta-count-wrapper" style="display:none;">Total de vídeos: <b id="info-count">—</b></span>
    </div>
  </div>

  <div class="playlist-card" id="playlist-card" style="display:none;">
    <div class="playlist-card-title">Opções da Playlist</div>
    <div class="field" id="playlist-mode-field" style="margin-bottom:0.75rem;">
      <label for="playlist-mode">O que deseja baixar?</label>
      <div class="select-wrap">
        <select id="playlist-mode">
          <option value="playlist">Baixar playlist inteira</option>
          <option value="single">Baixar apenas este vídeo</option>
        </select>
      </div>
    </div>
    <div class="field" style="display:flex;align-items:center;gap:0.75rem;margin-bottom:0;">
      <label class="toggle" for="playlist-subfolder">
        <input type="checkbox" id="playlist-subfolder" checked />
        <div class="toggle-track"></div>
        <div class="toggle-thumb"></div>
      </label>
      <span class="toggle-label">Criar subpasta com o nome da playlist</span>
    </div>
  </div>

  <div class="field">
    <label for="output_dir">Pasta de destino</label>
    <div style="display:flex;gap:0.5rem;">
      <input type="text" id="output_dir" placeholder="Ex: C:\Users\Você\Downloads" style="flex:1;" />
      <button id="btn-browse" style="width:auto;padding:0 1rem;flex-shrink:0;">📁</button>
    </div>
  </div>

  <div class="row">
    <div class="field" id="format-field">
      <label for="format">Qualidade</label>
      <div class="select-wrap">
        <select id="format">
          <option value="best">Melhor disponível</option>
          <option value="bestvideo[height<=1080]+bestaudio/best">1080p</option>
          <option value="bestvideo[height<=720]+bestaudio/best">720p</option>
          <option value="bestvideo[height<=480]+bestaudio/best">480p</option>
        </select>
      </div>
    </div>
    <div class="field" id="container-field">
      <label for="container">Formato do arquivo</label>
      <div class="select-wrap">
        <select id="container">
          <option value="mp4">MP4</option>
          <option value="mkv">MKV</option>
          <option value="webm">WebM</option>
          <option value="original">Original (sem conversão)</option>
        </select>
      </div>
    </div>
  </div>

  <div class="field" style="display:flex;align-items:center;gap:0.75rem;margin-bottom:1.25rem;">
    <label class="toggle" for="audio-only">
      <input type="checkbox" id="audio-only" />
      <div class="toggle-track"></div>
      <div class="toggle-thumb"></div>
    </label>
    <span class="toggle-label">Só áudio (MP3)</span>
  </div>

  <div class="field" style="display:flex;align-items:center;gap:0.75rem;margin-bottom:1.25rem;">
    <label class="toggle" for="h264-compat">
      <input type="checkbox" id="h264-compat" />
      <div class="toggle-track"></div>
      <div class="toggle-thumb"></div>
    </label>
    <span class="toggle-label">Compatível com Premiere (H.264) <span style="font-size:0.65rem;opacity:0.6;">— recodifica o vídeo, processo mais lento</span></span>
  </div>

  <div class="field">
    <label for="browser-cookies">Cookies do navegador <span style="font-size:0.65rem;opacity:0.6;">(necessário para Instagram Stories, conteúdo privado)</span></label>
    <div class="select-wrap">
      <select id="browser-cookies">
        <option value="">Nenhum (não usar cookies)</option>
        <option value="chrome">Chrome</option>
        <option value="firefox">Firefox</option>
        <option value="edge">Edge</option>
        <option value="brave">Brave</option>
        <option value="opera">Opera</option>
      </select>
    </div>
  </div>

  <div class="field">
    <label for="cookies-file">Arquivo cookies.txt <span style="font-size:0.65rem;opacity:0.6;">(alternativa ao seletor acima — útil para Globoplay, Chrome com DPAPI)</span></label>
    <div style="display:flex;gap:0.5rem;">
      <input type="text" id="cookies-file" placeholder="Ex: C:\Users\Você\cookies.txt" style="flex:1;" />
      <button id="btn-browse-cookies" style="width:auto;padding:0 1rem;flex-shrink:0;">📄</button>
    </div>
  </div>

  <button id="btn-download">Baixar</button>

  <div class="progress-box" id="progress-box">
    <div class="progress-header">
      <span class="progress-status" id="progress-status">Aguardando...</span>
      <span class="progress-percent" id="progress-percent">0%</span>
    </div>
    <div class="progress-current-item" id="progress-current-item" style="display:none;"></div>
    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="progress-bar"></div>
    </div>
    <div class="progress-meta">
      <span>Velocidade: <b id="meta-speed">—</b></span>
      <span>ETA: <b id="meta-eta">—</b></span>
      <span id="meta-playlist-progress" style="display:none;">Progresso: <b id="meta-playlist-item">—</b></span>
    </div>
  </div>

  <div class="msg" id="msg"></div>
</div>

<script>
  const urlInput     = document.getElementById('url');
  const dirInput     = document.getElementById('output_dir');
  const formatSel    = document.getElementById('format');
  const containerSel = document.getElementById('container');
  const audioToggle  = document.getElementById('audio-only');
  const btn          = document.getElementById('btn-download');
  const progressBox  = document.getElementById('progress-box');
  const progressBar  = document.getElementById('progress-bar');
  const progressPct  = document.getElementById('progress-percent');
  const progressStat = document.getElementById('progress-status');
  const metaSpeed    = document.getElementById('meta-speed');
  const metaEta      = document.getElementById('meta-eta');
  const msg          = document.getElementById('msg');
  const formatField  = document.getElementById('format-field');
  const containerField = document.getElementById('container-field');
  const themeBtn     = document.getElementById('theme-btn');
  const infoBox      = document.getElementById('info-box');
  const infoTitle    = document.getElementById('info-title');
  const infoSize     = document.getElementById('info-size');
  const infoDuration = document.getElementById('info-duration');
  const infoThumb    = document.getElementById('info-thumb');
  const infoEmbed    = document.getElementById('info-embed');
  const btnBrowse    = document.getElementById('btn-browse');
  const browserCookiesSel = document.getElementById('browser-cookies');
  const cookiesFileInput  = document.getElementById('cookies-file');
  const btnBrowseCookies  = document.getElementById('btn-browse-cookies');
  const h264CompatToggle  = document.getElementById('h264-compat');

  // Elementos de Playlist
  const playlistBadge        = document.getElementById('playlist-badge');
  const playlistBadgeText    = document.getElementById('playlist-badge-text');
  const playlistCard         = document.getElementById('playlist-card');
  const playlistModeField    = document.getElementById('playlist-mode-field');
  const playlistModeSel      = document.getElementById('playlist-mode');
  const playlistSubfolderToggle = document.getElementById('playlist-subfolder');
  const metaSizeWrapper      = document.getElementById('meta-size-wrapper');
  const metaDurationWrapper  = document.getElementById('meta-duration-wrapper');
  const metaCountWrapper     = document.getElementById('meta-count-wrapper');
  const infoCount            = document.getElementById('info-count');
  const progressCurrentItem  = document.getElementById('progress-current-item');
  const metaPlaylistProgress = document.getElementById('meta-playlist-progress');
  const metaPlaylistItem     = document.getElementById('meta-playlist-item');

  let currentPlaylistData = null;

  function resetPlaylistState() {
    playlistBadge.style.display = 'none';
    playlistCard.style.display = 'none';
    metaCountWrapper.style.display = 'none';
    metaSizeWrapper.style.display = '';
    metaDurationWrapper.style.display = '';
    progressCurrentItem.style.display = 'none';
    metaPlaylistProgress.style.display = 'none';
    btn.textContent = 'Baixar';
    currentPlaylistData = null;
  }

  // Alternância do modo playlist vs vídeo único
  playlistModeSel.addEventListener('change', () => {
    if (playlistModeSel.value === 'single') {
      fetchInfo(true);
    } else {
      fetchInfo(false);
    }
  });

  // Seleção de arquivo cookies.txt via janela nativa
  btnBrowseCookies.addEventListener('click', async () => {
    try {
      const res = await fetch('/browse-file', { method: 'POST' });
      const data = await res.json();
      if (data.file) cookiesFileInput.value = data.file;
    } catch (e) {
      showMsg('Não foi possível abrir o seletor de arquivo.', 'error');
    }
  });

  // Seleção de pasta via janela nativa do Windows
  btnBrowse.addEventListener('click', async () => {
    try {
      const res = await fetch('/browse-folder', { method: 'POST' });
      const data = await res.json();
      if (data.folder) dirInput.value = data.folder;
    } catch (e) {
      showMsg('Não foi possível abrir o seletor de pasta.', 'error');
    }
  });

  // Tema claro/escuro
  let isLight = false;
  themeBtn.addEventListener('click', () => {
    isLight = !isLight;
    document.documentElement.classList.toggle('light', isLight);
    themeBtn.textContent = isLight ? '☽ Escuro' : '☀ Claro';
  });

  audioToggle.addEventListener('change', () => {
    const disabled = audioToggle.checked;
    formatField.style.opacity = disabled ? '0.3' : '1';
    formatField.style.pointerEvents = disabled ? 'none' : '';
    containerField.style.opacity = disabled ? '0.3' : '1';
    containerField.style.pointerEvents = disabled ? 'none' : '';
    if (urlInput.value.trim()) fetchInfo(playlistModeSel.value === 'single');
  });

  formatSel.addEventListener('change', () => {
    if (urlInput.value.trim()) fetchInfo(playlistModeSel.value === 'single');
  });

  // Busca info do vídeo ao sair do campo URL
  let infoTimer = null;
  urlInput.addEventListener('input', () => {
    clearTimeout(infoTimer);
    infoBox.classList.remove('visible');
    infoThumb.classList.remove('visible');
    infoThumb.src = '';
    infoEmbed.classList.remove('visible');
    infoEmbed.src = '';
    resetPlaylistState();
    infoTimer = setTimeout(() => {
      if (urlInput.value.trim()) fetchInfo();
    }, 800);
  });

  async function fetchInfo(forceSingle = false) {
    infoBox.classList.add('visible');
    infoThumb.classList.remove('visible');
    infoThumb.src = '';
    infoEmbed.classList.remove('visible');
    infoEmbed.src = '';
    infoTitle.textContent = 'Consultando...';
    infoSize.textContent = '—';
    infoDuration.textContent = '—';
    infoCount.textContent = '—';

    if (!forceSingle) {
      resetPlaylistState();
    }

    try {
      const res = await fetch('/info', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          url: urlInput.value.trim(),
          format: formatSel.value,
          audio_only: audioToggle.checked,
          browser_cookies: browserCookiesSel.value,
          cookies_file: cookiesFileInput.value.trim(),
          force_single: forceSingle,
        }),
      });
      const data = await res.json();
      if (data.error) {
        infoTitle.textContent = 'Não foi possível obter informações.';
        infoSize.textContent = '—';
        infoDuration.textContent = data.error.includes('log in') || data.error.includes('cookies')
          ? 'Requer autenticação — use cookies'
          : '—';
        return;
      }

      if (data.is_playlist) {
        currentPlaylistData = data;
        playlistBadge.style.display = 'inline-flex';
        playlistBadgeText.textContent = `Playlist (${data.playlist_count} vídeos)`;
        playlistCard.style.display = 'block';

        if (data.has_single_video) {
          playlistModeField.style.display = 'block';
        } else {
          playlistModeField.style.display = 'none';
          playlistModeSel.value = 'playlist';
        }

        infoTitle.textContent = data.title || 'Playlist';
        metaSizeWrapper.style.display = 'none';
        metaDurationWrapper.style.display = 'none';
        metaCountWrapper.style.display = '';
        infoCount.textContent = `${data.playlist_count} vídeos`;

        if (playlistModeSel.value === 'playlist') {
          btn.textContent = `Baixar Playlist (${data.playlist_count} vídeos)`;
        } else {
          btn.textContent = 'Baixar Vídeo';
        }

        if (data.thumbnail) {
          infoThumb.src = data.thumbnail;
          infoThumb.onload = () => infoThumb.classList.add('visible');
          infoThumb.onerror = () => infoThumb.classList.remove('visible');
          infoEmbed.classList.remove('visible');
        }
      } else {
        infoTitle.textContent = data.title || '—';
        metaSizeWrapper.style.display = '';
        metaDurationWrapper.style.display = '';
        metaCountWrapper.style.display = 'none';

        infoSize.textContent = data.filesize
          ? (data.approximate ? '~' : '') + fmtBytes(data.filesize)
          : 'Desconhecido';
        infoDuration.textContent = data.duration ? fmtDuration(data.duration) : '—';

        if (currentPlaylistData) {
          btn.textContent = 'Baixar Vídeo';
        } else {
          btn.textContent = 'Baixar';
        }

        const youtubeId = extractYouTubeId(urlInput.value.trim());
        if (youtubeId) {
          infoEmbed.src = `https://www.youtube.com/embed/${youtubeId}`;
          infoEmbed.classList.add('visible');
          infoThumb.classList.remove('visible');
        } else if (data.thumbnail) {
          infoThumb.src = data.thumbnail;
          infoThumb.onload = () => infoThumb.classList.add('visible');
          infoThumb.onerror = () => infoThumb.classList.remove('visible');
          infoEmbed.classList.remove('visible');
        }
      }
    } catch (e) {
      infoTitle.textContent = 'Servidor indisponível.';
    }
  }

  function extractYouTubeId(url) {
    // Suporta youtube.com/watch?v=, youtu.be/, youtube.com/shorts/
    const patterns = [
      /[?&]v=([a-zA-Z0-9_-]{11})/,
      /youtu\.be\/([a-zA-Z0-9_-]{11})/,
      /youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/,
    ];
    for (const p of patterns) {
      const m = url.match(p);
      if (m) return m[1];
    }
    return null;
  }

  function fmtBytes(bytes) {
    if (bytes >= 1073741824) return (bytes / 1073741824).toFixed(2) + ' GB';
    if (bytes >= 1048576)    return (bytes / 1048576).toFixed(1) + ' MB';
    return (bytes / 1024).toFixed(0) + ' KB';
  }

  function fmtDuration(seconds) {
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = seconds % 60;
    if (h > 0) return `${h}h ${m}m ${s}s`;
    if (m > 0) return `${m}m ${s}s`;
    return `${s}s`;
  }

  function showMsg(text, type) {
    msg.textContent = text;
    msg.className = 'msg ' + type;
  }

  function hideMsg() {
    msg.className = 'msg';
  }

  function fmtEta(seconds) {
    if (!seconds) return '—';
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return m > 0 ? `${m}m ${s}s` : `${s}s`;
  }

  let pollTimer = null;

  function poll(downloadId) {
    pollTimer = setInterval(async () => {
      try {
        const res = await fetch(`/progress/${downloadId}`);
        const data = await res.json();

        if (data.status === 'downloading') {
          if (data.is_playlist) {
            progressStat.textContent = 'Baixando playlist...';
            if (data.playlist_index) {
              metaPlaylistProgress.style.display = '';
              metaPlaylistItem.textContent = `${data.playlist_index} de ${data.playlist_count || '?'}`;
            }
            if (data.video_title) {
              progressCurrentItem.style.display = 'block';
              progressCurrentItem.textContent = `▶ [${data.playlist_index || '?'}/${data.playlist_count || '?'}] ${data.video_title}`;
            }
          } else {
            progressStat.textContent = 'Baixando...';
            metaPlaylistProgress.style.display = 'none';
            progressCurrentItem.style.display = 'none';
          }
          progressBar.style.width = data.percent + '%';
          progressPct.textContent = data.percent + '%';
          metaSpeed.textContent = data.speed + ' KB/s';
          metaEta.textContent = fmtEta(data.eta);
        } else if (data.status === 'item_finished') {
          if (data.is_playlist) {
            progressStat.textContent = `Vídeo ${data.playlist_index || '?'} de ${data.playlist_count || '?'} concluído`;
            if (data.video_title) {
              progressCurrentItem.style.display = 'block';
              progressCurrentItem.textContent = `✓ [${data.playlist_index || '?'}/${data.playlist_count || '?'}] ${data.video_title}`;
            }
          }
          progressBar.style.width = '100%';
          progressPct.textContent = '100%';
        } else if (data.status === 'remuxing') {
          progressStat.textContent = 'Convertendo para Premiere...';
          progressBar.style.width = '100%';
          progressPct.textContent = '100%';
          metaSpeed.textContent = '—';
          metaEta.textContent = '—';
        } else if (data.status === 'finished') {
          clearInterval(pollTimer);
          progressBar.style.width = '100%';
          progressPct.textContent = '100%';
          progressStat.textContent = 'Concluído';
          metaSpeed.textContent = '—';
          metaEta.textContent = '—';
          progressCurrentItem.style.display = 'none';
          metaPlaylistProgress.style.display = 'none';
          btn.disabled = false;
          showMsg(data.message || 'Download concluído com sucesso.', 'success');
        } else if (data.status === 'error') {
          clearInterval(pollTimer);
          btn.disabled = false;
          progressCurrentItem.style.display = 'none';
          metaPlaylistProgress.style.display = 'none';
          showMsg('Erro: ' + data.message, 'error');
        } else if (data.status === 'starting') {
          progressStat.textContent = data.is_playlist ? 'Iniciando playlist...' : 'Iniciando...';
        }
      } catch (e) {
        clearInterval(pollTimer);
        btn.disabled = false;
        showMsg('Erro de comunicação com o servidor.', 'error');
      }
    }, 800);
  }

  btn.addEventListener('click', async () => {
    hideMsg();
    const url = urlInput.value.trim();
    if (!url) { showMsg('Informe a URL.', 'error'); return; }

    const isPlaylistMode = (playlistCard.style.display !== 'none' && playlistModeSel.value === 'playlist');

    btn.disabled = true;
    progressBox.classList.add('visible');
    progressBar.style.width = '0%';
    progressPct.textContent = '0%';
    progressStat.textContent = isPlaylistMode ? 'Iniciando playlist...' : 'Iniciando...';
    metaSpeed.textContent = '—';
    metaEta.textContent = '—';
    progressCurrentItem.style.display = 'none';
    metaPlaylistProgress.style.display = 'none';

    try {
      const res = await fetch('/download', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          url,
          output_dir: dirInput.value.trim(),
          format: formatSel.value,
          container: containerSel.value,
          audio_only: audioToggle.checked,
          browser_cookies: browserCookiesSel.value,
          cookies_file: cookiesFileInput.value.trim(),
          h264_compat: h264CompatToggle.checked,
          download_playlist: isPlaylistMode,
          create_subfolder: playlistSubfolderToggle.checked,
        }),
      });
      const data = await res.json();
      if (data.error) { showMsg(data.error, 'error'); btn.disabled = false; return; }
      poll(data.download_id);
    } catch (e) {
      showMsg('Não foi possível conectar ao servidor Flask.', 'error');
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
